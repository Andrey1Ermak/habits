<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Привычки">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Привычки</title>
<style>
:root{--bg:#fff;--panel:#fff;--line:#d5dbe3;--text:#1A1A1A;--muted:#555;--navy:#1B355E;--blue:#2E5A88;--red:#8C1C1C;--stripe:#F0F0F0;
--ok:#3A8D4F;--miss:#B22222;--cell:68px;--name:130px;
--font:Abadi,"Abadi MT","Gill Sans","Gill Sans MT","Avenir Next",-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;margin:0;background:var(--bg);color:var(--text);font:15px var(--font);height:100%;overscroll-behavior:none}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 0}
.titlebar{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:4px double var(--navy)}
header h1{font-size:24px;font-weight:800;letter-spacing:.01em;margin:0;flex:1;color:var(--navy);text-transform:uppercase}
button{background:#fff;color:var(--navy);border:1.5px solid var(--navy);border-radius:2px;padding:7px 12px;font:700 13px var(--font);letter-spacing:.06em;text-transform:uppercase}
header button{padding:4px 12px;font-size:18px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0 0}
table{border-collapse:separate;border-spacing:0}
th,td{height:var(--cell);min-width:var(--cell);width:var(--cell);text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;user-select:none;-webkit-user-select:none}
thead th{font-size:13px;color:#fff;background:var(--navy);font-weight:700;height:50px;line-height:1.2;border-color:#2c4a78}
thead th.we{background:var(--blue)}
thead th.today{background:var(--red)}
tbody tr:nth-child(even) td{background-color:var(--stripe)}
td.today{box-shadow:inset 0 0 0 2px var(--red)}
.name{position:sticky;left:0;z-index:2;background:var(--bg);min-width:var(--name);width:var(--name);max-width:var(--name);text-align:left;padding:0 8px 0 16px;font-size:15px;font-weight:700;cursor:pointer}
.name .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;width:calc(var(--name) - 25px);overflow:hidden;line-height:1.2}
thead .name{z-index:3;background:var(--navy)}
.prev{position:sticky;left:var(--name);z-index:2;background:var(--bg);min-width:68px;width:68px;font-size:12px;border-right:2px solid var(--navy);padding:0 2px}
thead .prev{z-index:3;background:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.prev .pct{display:block;font-weight:800;font-size:16px;color:var(--navy)}
.prev .n{display:block;color:var(--muted);font-size:11px}
td.c{cursor:pointer}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
dialog{background:#fff;color:var(--text);border:none;border-top:4px solid var(--navy);border-radius:2px;width:min(92vw,360px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(27,53,94,.35)}
button:focus,button:focus-visible{outline:none}
dialog input:focus{outline:none;border-color:var(--navy)}
dialog input{width:100%;font:16px var(--font);padding:10px;border-radius:2px;border:1px solid var(--line);background:#fff;color:var(--text)}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.danger{color:var(--miss);border-color:var(--miss)}
.move button{flex:1}
button:disabled{opacity:.3}
</style>
</head>
<body>
<header>
  <div class="titlebar">
    <h1 id="title"></h1>
    <button id="prev">‹</button>
    <button id="next">›</button>
  </div>
</header>
<div class="wrap" id="wrap"><table id="grid"></table></div>
<div class="foot">
  <button id="add">+ Привычка</button>
  <button id="syncBtn">Синхронизация</button>
  <span id="sync" style="cursor:pointer;padding:6px 4px;align-self:center;color:var(--muted);font-size:13px"></span>
</div>

<dialog id="dlg">
  <form method="dialog">
    <input id="dName" placeholder="Название" autocomplete="off">
    <div class="row move" id="dMove">
      <button type="button" id="dUp">↑ Выше</button>
      <button type="button" id="dDown">↓ Ниже</button>
    </div>
    <div class="row">
      <button type="button" id="dDel" class="danger">Удалить</button>
      <span style="flex:1"></span>
      <button type="button" id="dCancel">Отмена</button>
      <button value="ok">OK</button>
    </div>
  </form>
</dialog>

<script>
const KEY='habits-v1';
const COLORS=['#22c55e','#3b82f6','#a855f7','#f59e0b','#ef4444','#14b8a6','#ec4899'];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S) S={habits:[{id:1,name:'Спорт',color:COLORS[0]},{id:2,name:'Чтение',color:COLORS[1]},{id:3,name:'Сон до 23:00',color:COLORS[2]}],done:{},nextId:4};
// t — когда менялась каждая отметка (сек), deleted — когда удалены привычки (сек)
// orderT — когда менялся порядок привычек (сек)
const normalize=d=>{d.habits=d.habits||[];d.done=d.done||{};d.t=d.t||{};d.deleted=d.deleted||{};d.updated=d.updated||0;d.nextId=d.nextId||1;d.orderT=d.orderT||0;return d};
const nowSec=()=>Math.floor(Date.now()/1000);
normalize(S);
const SYNC_KEY='habits-sync-url';
let syncUrl='';try{syncUrl=localStorage.getItem(SYNC_KEY)||''}catch(e){}
let pushTimer=null;
const save=()=>{
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(syncUrl){clearTimeout(pushTimer);pushTimer=setTimeout(()=>sync(),1500)}
};
let lastErr='';
function setStatus(t){const el=document.getElementById('sync');if(el)el.textContent=t}
// Объединение двух копий: по каждой отметке и привычке побеждает более позднее изменение
function merge(a,b){
  const nw=b.updated>a.updated?b:a,old=nw===a?b:a;
  const done={},t={};
  const keys=new Set([...Object.keys(a.done),...Object.keys(b.done),...Object.keys(a.t),...Object.keys(b.t)]);
  for(const k of keys){
    const ta=a.t[k]||0,tb=b.t[k]||0;
    let src=nw;
    if(ta!==tb)src=ta>tb?a:b;
    // времени нет, а отметка только в одной копии — не теряем её
    else if(!ta&&(k in a.done)!==(k in b.done))src=k in a.done?a:b;
    if(k in src.done)done[k]=src.done[k];
    if(src.t[k])t[k]=src.t[k];
  }
  const deleted={...a.deleted};
  for(const id in b.deleted)deleted[id]=Math.max(deleted[id]||0,b.deleted[id]);
  // порядок — из копии, где его меняли позже; привычки, которых там нет, идут в конец
  const ord=a.orderT!==b.orderT?(a.orderT>b.orderT?a:b):nw,other=ord===a?b:a;
  const byId=new Map();
  for(const hb of [...ord.habits,...other.habits])if(!byId.has(hb.id))byId.set(hb.id,hb);
  // содержимое привычки — из более поздней правки (место в порядке при этом не меняется)
  for(const hb of [...old.habits,...nw.habits])if((hb.t||0)>=(byId.get(hb.id).t||0))byId.set(hb.id,hb);
  const habits=[...byId.values()].filter(hb=>!(hb.id in deleted)||(hb.t||0)>deleted[hb.id]);
  // отметки удалённых привычек убираем
  const alive=new Set(habits.map(hb=>String(hb.id)));
  for(const m of [done,t])for(const k in m){const id=k.split('|')[0];if(id in deleted&&!alive.has(id))delete m[k]}
  return {habits,done,t,deleted,updated:Math.max(a.updated,b.updated),nextId:Math.max(a.nextId,b.nextId),orderT:Math.max(a.orderT,b.orderT),v:2};
}
// время старых отметок не нужно для объединения и только раздувает данные в облаке
function pruneTimes(d){
  const edge=nowSec()-60*86400;
  for(const k in d.t)if(d.t[k]<edge)delete d.t[k];
  return d;
}
const sorted=o=>Object.keys(o).sort().map(k=>[k,o[k]]);
const canon=d=>JSON.stringify([d.v||0,d.orderT||0,d.habits,sorted(d.done),sorted(d.t),sorted(d.deleted)]);

let syncing=false,again=null;
async function sync(force){
  if(!syncUrl)return;
  // без сети отметки остаются на устройстве и уйдут, когда сеть появится
  if(navigator.onLine===false){lastErr='';setStatus('☁︎ нет сети');return}
  if(syncing){again=again==='force'||force?'force':'plain';return}
  syncing=true;
  try{
    setStatus('☁︎ …');
    let r;
    try{r=await fetch(syncUrl)}catch(e){throw new Error('Загрузка: запрос не прошёл ('+(e.message||e)+'). Обычно это значит, что доступ к скрипту не «Anyone».')}
    const txt=await r.text();
    let remote;
    try{remote=JSON.parse(txt)}catch(e){throw new Error('Загрузка: скрипт ответил не JSON (HTTP '+r.status+'): '+txt.slice(0,120))}
    if(!remote||typeof remote!=='object')throw new Error('Загрузка: неожиданный ответ скрипта: '+txt.slice(0,120));
    const valid=!!(remote.habits&&remote.done);
    if(valid)normalize(remote);
    let next;
    if(!valid)next=S;                                   // в облаке пока пусто
    else if(force)next=remote;                          // при подключении облако главнее
    else if(S.v===2&&remote.v===2)next=merge(S,remote);
    else next=(remote.updated>S.updated)?remote:S;      // копия старого формата: без времени отметок берём более новую целиком
    next=pruneTimes(normalize(JSON.parse(JSON.stringify(next))));
    next.v=2;
    if(canon(next)!==canon(S)){
      S=next;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      const w=document.getElementById('wrap'),sl=w.scrollLeft;
      render();
      w.scrollLeft=sl;
    }
    if(!valid||canon(next)!==canon(remote)){
      const body=JSON.stringify(next);
      const pr=await fetch(syncUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body});
      const ptxt=await pr.text();
      if(!ptxt.trim().startsWith('{'))throw new Error('Отправка: скрипт ответил не JSON (HTTP '+pr.status+'): '+ptxt.slice(0,120));
    }
    lastErr='';
    setStatus('☁︎ ✓');
  }catch(e){lastErr=e.message||String(e);setStatus('☁︎ ✗')}
  finally{
    syncing=false;
    if(again){const f=again==='force';again=null;sync(f)}
  }
}
// просим iOS/браузер не вычищать хранилище
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const now=new Date();
let Y=now.getFullYear(),M=now.getMonth();
const pad=n=>String(n).padStart(2,'0');
const key=(id,d)=>`${id}|${Y}-${pad(M+1)}-${pad(d)}`;
const WD=['вс','пн','вт','ср','чт','пт','сб'];

function render(){
  const days=new Date(Y,M+1,0).getDate();
  const isCur=Y===now.getFullYear()&&M===now.getMonth();
  const today=now.getDate();
  const mn=new Date(Y,M,1).toLocaleDateString('ru-RU',{month:'long'});
  document.getElementById('title').textContent=mn[0].toUpperCase()+mn.slice(1)+' '+Y;
  const pY=M===0?Y-1:Y, pM=M===0?11:M-1, pDays=new Date(pY,pM+1,0).getDate();
  const pLabel=new Date(pY,pM,1).toLocaleDateString('ru-RU',{month:'short'}).replace('.','');
  let h=`<thead><tr><th class="name"></th><th class="prev">${pLabel}<br>итог</th>`;
  for(let d=1;d<=days;d++){
    const wd=new Date(Y,M,d).getDay();
    const cls=[(wd===0||wd===6)?'we':'',isCur&&d===today?'today':''].join(' ');
    h+=`<th class="${cls}">${d}<br>${WD[wd]}</th>`;
  }
  h+='</tr></thead><tbody>';
  for(const hb of S.habits){
    let cnt=0;
    let cells='';
    for(let d=1;d<=days;d++){
      const st=S.done[key(hb.id,d)]||0; if(st===1)cnt++;
      const t=isCur&&d===today?' today':'';
      const bg=st===1?'var(--ok)':st===2?'var(--miss)':'transparent';
      cells+=`<td class="c${t}" data-h="${hb.id}" data-d="${d}" style="background:${bg}"></td>`;
    }
    let pc=0;
    const pre=`${hb.id}|${pY}-${pad(pM+1)}-`;
    for(const k in S.done) if(k.startsWith(pre)&&S.done[k]===1) pc++;
    const pct=Math.round(pc/pDays*100);
    const alpha=Math.round(pct/100*0.55*255).toString(16).padStart(2,'0');
    const prevCell=`<td class="prev" style="background:linear-gradient(#3A8D4F${alpha},#3A8D4F${alpha}),var(--bg)"><span class="pct">${pct}%</span><span class="n">${pc}/${pDays}</span></td>`;
    h+=`<tr><td class="name" data-edit="${hb.id}"><span class="t">${esc(hb.name)}</span></td>${prevCell}${cells}</tr>`;
  }
  h+='</tbody>';
  document.getElementById('grid').innerHTML=h;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function scrollToToday(){
  const w=document.getElementById('wrap');
  const isCur=Y===now.getFullYear()&&M===now.getMonth();
  if(!isCur){w.scrollLeft=0;return}
  const th=document.querySelector('thead th.today'), pv=document.querySelector('thead th.prev');
  if(!th||!pv)return;
  // ширина закреплённых столбцов (название + итог) — они всегда видны слева
  const wr=w.getBoundingClientRect(), tr=th.getBoundingClientRect(), pr=pv.getBoundingClientRect();
  const sticky=pr.right-wr.left;               // где кончаются закреплённые столбцы
  const todayInContent=tr.left-wr.left+w.scrollLeft;
  // сегодняшний день — первым сразу после столбца итога прошлого месяца
  w.scrollLeft=Math.max(0,todayInContent-sticky);
}

document.getElementById('grid').addEventListener('click',e=>{
  const td=e.target.closest('td');
  if(!td)return;
  if(td.dataset.edit){openDlg(+td.dataset.edit);return}
  if(!td.dataset.h)return;
  const k=key(td.dataset.h,td.dataset.d);
  const st=S.done[k]||0;
  if(st===0)S.done[k]=1; else if(st===1)S.done[k]=2; else delete S.done[k];
  S.t[k]=nowSec();
  save();
  const sl=document.getElementById('wrap').scrollLeft;
  render();
  document.getElementById('wrap').scrollLeft=sl;
  if(navigator.vibrate)navigator.vibrate(8);
});

document.getElementById('prev').onclick=()=>{M--;if(M<0){M=11;Y--}render();scrollToToday()};
document.getElementById('next').onclick=()=>{M++;if(M>11){M=0;Y++}render();scrollToToday()};

const dlg=document.getElementById('dlg'),dName=document.getElementById('dName'),dDel=document.getElementById('dDel');
let editId=null,selColor=COLORS[0];
function openDlg(id){
  editId=id;
  const hb=S.habits.find(x=>x.id===id);
  dName.value=hb?hb.name:'';
  selColor=hb?hb.color:COLORS[S.habits.length%COLORS.length];
  dDel.style.display=hb?'':'none';
  document.getElementById('dMove').style.display=hb?'':'none';
  updateMove();
  dlg.showModal();
}
function updateMove(){
  const i=S.habits.findIndex(x=>x.id===editId);
  document.getElementById('dUp').disabled=i<=0;
  document.getElementById('dDown').disabled=i<0||i===S.habits.length-1;
}
function moveHabit(step){
  const i=S.habits.findIndex(x=>x.id===editId),j=i+step;
  if(i<0||j<0||j>=S.habits.length)return;
  [S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];
  S.orderT=nowSec();
  save();
  const w=document.getElementById('wrap'),sl=w.scrollLeft;
  render();
  w.scrollLeft=sl;
  updateMove();
}
document.getElementById('dUp').onclick=()=>moveHabit(-1);
document.getElementById('dDown').onclick=()=>moveHabit(1);
dlg.addEventListener('close',()=>{
  const v=dlg.returnValue,name=dName.value.trim();
  // Esc не меняет returnValue — сбрасываем, чтобы в следующий раз не сработало прошлое действие
  dlg.returnValue='';
  let changed=false;
  if(v==='ok'&&name){
    const hb=S.habits.find(x=>x.id===editId);
    if(hb){if(hb.name!==name){hb.name=name;hb.t=nowSec();changed=true}}
    else{
      // id от времени: два устройства без связи не выдадут один и тот же номер
      const id=Math.max(Date.now(),S.nextId);
      S.nextId=id+1;
      S.habits.push({id,name,color:selColor,t:nowSec()});
      changed=true;
    }
  }else if(v==='del'&&editId!=null&&confirm('Удалить привычку и все её отметки?')){
    S.habits=S.habits.filter(x=>x.id!==editId);
    for(const m of [S.done,S.t])for(const k in m)if(k.startsWith(editId+'|'))delete m[k];
    S.deleted[editId]=nowSec();
    changed=true;
  }
  // без изменений не трогаем S.updated, иначе устаревшие данные перезапишут облако
  if(changed){save();render()}
});
dDel.onclick=()=>dlg.close('del');
document.getElementById('dCancel').onclick=()=>dlg.close('cancel');
document.getElementById('add').onclick=()=>openDlg(null);



document.getElementById('syncBtn').onclick=()=>{
  const u=prompt('URL веб-приложения Google Apps Script (пусто — отключить):',syncUrl);
  if(u===null)return;
  syncUrl=u.trim();
  try{syncUrl?localStorage.setItem(SYNC_KEY,syncUrl):localStorage.removeItem(SYNC_KEY)}catch(e){}
  setStatus('');
  // при подключении облака — облако главнее локальных данных
  sync(true);
};

document.getElementById('sync').onclick=()=>{if(lastErr)alert(lastErr)};
render();scrollToToday();
sync();
window.addEventListener('online',()=>sync());
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});


// если приложение висело в фоне и наступил новый день/месяц — обновить
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'){hiddenAt=Date.now();return}
  sync();
  const t=new Date();
  if(t.toDateString()!==now.toDateString()){
    now.setTime(t.getTime());
    Y=t.getFullYear();M=t.getMonth();
    render();scrollToToday();
  }else if(Date.now()-hiddenAt>60000){
    // приложение было свёрнуто дольше минуты — считаем это новым открытием
    Y=t.getFullYear();M=t.getMonth();
    render();scrollToToday();
  }
});
// повторная прокрутка после загрузки шрифтов (ширины могут измениться)
window.addEventListener('load',()=>requestAnimationFrame(scrollToToday));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(scrollToToday));
</script>
</body>
</html>
